<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Joy Ghosh — PM who builds</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#07080f;color:#e8eaf0;font-family:Arial, sans-serif;line-height:1.6}

/* NAV */
nav{
position:fixed;top:0;width:100%;height:60px;
display:flex;justify-content:space-between;align-items:center;
padding:0 5%;background:#0d1117;border-bottom:1px solid #222;
z-index:1000;
}

/* HERO */
#hero{
min-height:100vh;
display:flex;
align-items:center;
padding:6rem 5% 2rem;
}

/* NEW LAYOUT */
.hero-wrap{
display:flex;
align-items:center;
justify-content:space-between;
gap:4rem;
width:100%;
}

.hero-left{
flex:1.3;
}

.hero-right{
flex:1;
display:flex;
justify-content:center;
}

/* IMAGE STYLE */
.hero-right img{
width:320px;
height:320px;
object-fit:cover;
border-radius:50%;
border:3px solid rgba(0,210,255,0.3);
box-shadow:0 0 40px rgba(0,210,255,0.25);
transition:0.3s;
}

.hero-right img:hover{
transform:scale(1.05);
}

/* TEXT */
.hero-name{
font-size:3.5rem;
font-weight:800;
margin-bottom:10px;
}

.hero-name span{
color:#00d2ff;
}

.hero-desc{
color:#7a8499;
max-width:500px;
margin-bottom:20px;
}

/* BUTTONS */
.btn{
padding:10px 20px;
border-radius:30px;
border:none;
cursor:pointer;
font-weight:600;
margin-right:10px;
}

.btn-primary{
background:#00d2ff;
color:#000;
}

.btn-outline{
background:transparent;
border:1px solid #00d2ff;
color:#00d2ff;
}

/* RESPONSIVE */
@media(max-width:900px){
.hero-wrap{
flex-direction:column;
text-align:center;
}

.hero-right img{
width:220px;
height:220px;
margin-top:20px;
}
}
</style>
</head>

<body>

<nav>
<div>Joy Ghosh</div>
</nav>

<section id="hero">

<div class="hero-wrap">

<!-- LEFT -->
<div class="hero-left">

<h1 class="hero-name">
Joy <span>Ghosh</span>
</h1>

<p class="hero-desc">
Senior Product Manager who builds AI products, demos, and enterprise platforms.
Bridging strategy with hands-on execution.
</p>

<button class="btn btn-primary">View Projects</button>
<button class="btn btn-outline">Contact</button>

</div>

<!-- RIGHT IMAGE -->
<div class="hero-right">
<img src="Profile Pic2.png" alt="Profile Image"/>
</div>

</div>

</section>

</body>
</html>
